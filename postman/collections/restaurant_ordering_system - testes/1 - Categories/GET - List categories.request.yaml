$kind: http-request
url: "{{baseUrl}}/categories"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      let body;
      try { body = pm.response.json(); } catch (e) { body = undefined; }
      pm.test("Retorna um array", () => pm.expect(body).to.be.an("array"));
      pm.test("Categorias têm os campos esperados", () => {
        if (!Array.isArray(body) || body.length === 0) return;
        pm.expect(body[0]).to.include.all.keys("id", "name", "description", "icon", "display_order", "active");
      });
    language: text/javascript
order: 1000
