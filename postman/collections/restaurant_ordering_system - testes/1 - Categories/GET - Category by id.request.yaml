$kind: http-request
url: "{{baseUrl}}/categories/{{categoryId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      let body;
      try { body = pm.response.json(); } catch (e) { body = undefined; }
      pm.test("Retorna a categoria criada", () => {
        pm.expect(body.id).to.eql(pm.collectionVariables.get("categoryId"));
        pm.expect(body.name).to.eql("Categoria Teste Postman");
      });
    language: text/javascript
order: 4000
