$kind: http-request
url: "{{baseUrl}}/"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("Redireciona para a documentação Swagger", () => {
        pm.expect(pm.response.text()).to.include("Swagger UI");
      });
    language: text/javascript
order: 1000
