$kind: http-request
url: "{{baseUrl}}/"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      let body;
      try { body = pm.response.json(); } catch (e) { body = undefined; }
      pm.test("Retorna a mensagem da API", () => {
        pm.expect(body).to.have.property("message", "API Restaurante");
      });
    language: text/javascript
order: 1000
