$kind: http-request
url: "{{baseUrl}}/products/{{productId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      let body;
      try { body = pm.response.json(); } catch (e) { body = undefined; }
      pm.test("Retorna o produto criado", () => {
        pm.expect(body.id).to.eql(pm.collectionVariables.get("productId"));
        pm.expect(body.title).to.eql("Produto Postman Teste");
      });
    language: text/javascript
order: 3000
