$kind: http-request
url: "{{baseUrl}}/products/search/{{productKeyword}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      let body;
      try { body = pm.response.json(); } catch (e) { body = undefined; }
      pm.test("Retorna um array", () => pm.expect(body).to.be.an("array"));
      pm.test("Contém o produto criado", () => {
        pm.expect(body.map(p => p.id)).to.include(pm.collectionVariables.get("productId"));
      });
    language: text/javascript
order: 6000
