$kind: http-request
url: "{{baseUrl}}/products/category/{{notFoundId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      let body;
      try { body = pm.response.json(); } catch (e) { body = undefined; }
      pm.test("Categoria sem produtos retorna array vazio", () => {
        pm.expect(body).to.be.an("array").that.is.empty;
      });
    language: text/javascript
order: 5000
